services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-zerotrust
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - zerotrust-net

  api:
    build: . 
    container_name: api-zerotrust
    ports:
      - "8081:8081"
    environment:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/zerotrust/protocol/openid-connect/certs
    depends_on:
      - keycloak
    networks:
      - zerotrust-net

networks:
  zerotrust-net:
    driver: bridge

volumes:
  keycloak-data: